
name: TCV Test OKX Market API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Test OKX public market API
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          url = (
              "https://www.okx.com/api/v5/market/tickers"
              "?instType=SWAP"
          )

          try:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "TCV-Market-Research/1.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.load(response)
                  print("HTTP:", response.status)
                  print("API code:", data.get("code"))
                  print("Number of tickers:",
                        len(data.get("data", [])))
                  if data.get("code") != "0":
                      raise RuntimeError("OKX API returned an error")
                  if not data.get("data"):
                      raise RuntimeError("No market data")
                  print("OKX public API test successful")
          except urllib.error.HTTPError as e:
              print("HTTP error:", e.code)
              raise
          PY
